version: 2.1

parameters:
  kernel-branch:
    type: string
    default: lineage-23.2
  build-ksu:
    type: boolean
    default: true
  sign-zip:
    type: boolean
    default: true

executors:
  kernel-builder:
    docker:
      - image: ubuntu:22.04
    working_directory: ~/project
    resource_class: large
    environment:
      USE_CCACHE: "1"
      TZ: Asia/Jakarta
      KERNEL_BRANCH: "<< pipeline.parameters.kernel-branch >>"
      BUILD_KSU: "<< pipeline.parameters.build-ksu >>"
      SIGN_ZIP: "<< pipeline.parameters.sign-zip >>"

jobs:
  lint:
    docker:
      - image: ubuntu:22.04
    resource_class: small
    steps:
      - run:
          name: Install lint and checkout dependencies
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates git openssh-client shellcheck python3 python3-yaml curl zip unzip
      - checkout
      - run:
          name: Validate shell scripts and YAML
          command: |
            bash -n build.sh config.example.sh
            shellcheck build.sh config.example.sh
            python3 -c 'import yaml; yaml.safe_load(open(".circleci/config.yml"))'
            python3 tests/smoke.py

  build:
    executor: kernel-builder
    steps:
      - run:
          name: Install kernel 4.4 build dependencies
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates git openssh-client bc bison build-essential flex \
              libssl-dev libelf-dev libncurses5 libtinfo5 python3 python-is-python3 curl \
              cpio zip unzip default-jre-headless ccache tzdata
      - checkout
      - restore_cache:
          keys:
            - kernel44-toolchains-v1-{{ arch }}-{{ checksum "build.sh" }}-
            - kernel44-toolchains-v1-{{ arch }}-
      - restore_cache:
          keys:
            - kernel44-ccache-v1-{{ .Branch }}-{{ checksum "build.sh" }}-
      - run:
          name: Build X00TD Linux 4.4 and package AnyKernel3
          no_output_timeout: 30m
          command: bash build.sh
      - run:
          name: Show compiler cache statistics
          when: always
          command: CCACHE_DIR="$PWD/.ccache" ccache --show-stats
      - save_cache:
          key: kernel44-toolchains-v1-{{ arch }}-{{ checksum "build.sh" }}-{{ epoch }}
          when: always
          paths:
            - .toolchains
      - save_cache:
          key: kernel44-ccache-v1-{{ .Branch }}-{{ checksum "build.sh" }}-{{ epoch }}
          when: always
          paths:
            - .ccache
      - store_artifacts:
          path: out-zip
          destination: KERNEL-BUILDS
      - store_artifacts:
          path: logs
          destination: BUILD-LOGS

workflows:
  kernel44-workflow:
    jobs:
      - lint
      - build:
          requires:
            - lint
