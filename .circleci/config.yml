version: 2.1

parameters:
  kernel-revision:
    type: string
    default: lineage-22.1

jobs:
  build:
    docker:
      - image: ubuntu:22.04
    resource_class: large
    working_directory: ~/project
    environment:
      KERNEL_REVISION: << pipeline.parameters.kernel-revision >>
      CCACHE_DIR: /root/project/.ccache-54
      KBUILD_BUILD_USER: Kyura
      KBUILD_BUILD_HOST: circleci
      TZ: Asia/Jakarta
    steps:
      - run:
          name: Install Linux 5.4 build dependencies
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates git openssh-client bc bison build-essential flex \
              libssl-dev libelf-dev clang-14 llvm-14 lld-14 \
              binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi \
              ccache python3 curl cpio gzip tar shellcheck
      - checkout
      - run:
          name: Validate the 5.4 build script
          command: bash -n scripts/build-5.4.sh && shellcheck scripts/build-5.4.sh
      - restore_cache:
          keys:
            - kernel54-ccache-v1-{{ checksum "scripts/build-5.4.sh" }}-
            - kernel54-ccache-v1-
      - run:
          name: Build X00TD Linux 5.4 image, DTB and modules
          no_output_timeout: 30m
          command: bash scripts/build-5.4.sh
      - save_cache:
          key: kernel54-ccache-v1-{{ checksum "scripts/build-5.4.sh" }}-{{ epoch }}
          when: always
          paths:
            - .ccache-54
      - store_artifacts:
          path: artifacts-54
          destination: X00TD-5.4
      - store_artifacts:
          path: logs-54
          destination: BUILD-LOGS

workflows:
  kernel54-workflow:
    jobs:
      - build
